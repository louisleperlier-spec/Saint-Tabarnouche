<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bataille de neige</title>
<meta name="description" content="Bataille de balles de neige en pâte à modeler à Saint-Tabarnouche. Elle joue toute seule.">
<style>
:root{--hud:rgba(30,34,48,.78);--ink:#fff;--red:#e0343b;--blue:#2f6fe0;--bg:#cfdbe8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2233}}
:root[data-theme="dark"]{--bg:#1b2233}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:"Nunito",system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:12px;left:12px;background:var(--hud);color:var(--ink);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;line-height:1.5;pointer-events:none;min-width:150px}
#hud b{font-size:17px}
#hud .r{color:#ff7b80}#hud .b{color:#8db8ff}
#hud .t{font-size:11px;opacity:.8;letter-spacing:.4px}
#hud .ev{font-size:12px;color:#ffd23f;min-height:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="t">BATAILLE DE NEIGE · MANCHE <span id="round">1</span></div>
  <div><span class="r">🔴 Rouges</span> <b id="hr">0</b> touches</div>
  <div><span class="b">🔵 Bleus</span> <b id="hb">0</b> touches</div>
  <div>❄️ <b id="thrown">0</b> balles lancées</div>
  <div class="ev" id="ev"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';
// =====================================================================
//  Bataille de balles de neige, style pâte à modeler. Tout est fait en code.
// =====================================================================
const canvas = document.getElementById('c');
const LOW = matchMedia('(pointer:coarse)').matches || Math.min(screen.width, screen.height) < 700;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, LOW ? 1.5 : 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfe6ee, 40, 120);
const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 400);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 0.8 ? 66 : w / h < 1.3 ? 55 : 46; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---------- outils ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (x) => { x = clamp(x); return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
let seed = 3; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const R = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const noise = (x, y, z, s) => Math.sin(x * 2.3 + s) * Math.sin(y * 2.9 + s * 1.7) * Math.sin(z * 2.1 + s * 0.6) + 0.5 * Math.sin(x * 5.1 - y * 3.7 + z * 4.3 + s * 2.3);

// relief « traces de doigts »
const bump = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 260; i++) { const x = rnd() * 256, y = rnd() * 256, r = 6 + rnd() * 24, v = rnd() < 0.5 ? 255 : 0; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${v},${v},${v},.1)`); gr.addColorStop(1, `rgba(${v},${v},${v},0)`); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
})();
const matCache = {};
function M(color, o = {}) { const k = color + JSON.stringify(o); if (!matCache[k]) matCache[k] = new THREE.MeshLambertMaterial({ color, bumpMap: LOW ? null : bump, bumpScale: 0.8, ...o }); return matCache[k]; }
// boule bosselée, ombrage doux
const lumpCache = {};
function lumpGeo(r, amp = 0.06, s = 1, det = LOW ? 2 : 3) {
  const k = [r, amp, s, det].join(); if (lumpCache[k]) return lumpCache[k];
  let g = new THREE.IcosahedronGeometry(r, det); g.deleteAttribute('normal'); g.deleteAttribute('uv');
  const P = g.attributes.position.array, map = new Map(), out = [], idx = [];
  for (let i = 0; i < P.length; i += 3) { const key = Math.round(P[i] * 1e4) + ',' + Math.round(P[i + 1] * 1e4) + ',' + Math.round(P[i + 2] * 1e4); let j = map.get(key); if (j === undefined) { j = out.length / 3; map.set(key, j); const x = P[i], y = P[i + 1], z = P[i + 2], f = 1 + amp * noise(x / r * 2, y / r * 2, z / r * 2, s); out.push(x * f, y * f, z * f); } idx.push(j); }
  g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(out, 3)); g.setIndex(idx); g.computeVertexNormals();
  return (lumpCache[k] = g);
}
// boîte arrondie bosselée
const boxCache = {};
function rbox(w, h, d, v = 0) {
  const key = [w, h, d, v].join(); if (boxCache[key]) return boxCache[key];
  const r = Math.min(0.22, Math.min(w, h, d) * 0.32), g = new THREE.BoxGeometry(w, h, d, 3, 3, 3);
  const P = g.attributes.position.array, N = g.attributes.normal.array, half = [w / 2, h / 2, d / 2], inn = half.map((x) => x - r);
  for (let i = 0; i < P.length; i += 3) for (let a = 0; a < 3; a++) if (Math.abs(P[i + a]) < half[a] - 1e-5) P[i + a] = Math.sign(P[i + a]) * inn[a];
  const amp = Math.min(0.035, r * 0.18);
  for (let i = 0; i < P.length; i += 3) {
    const x = P[i], y = P[i + 1], z = P[i + 2], cx = clamp(x, -inn[0], inn[0]), cy = clamp(y, -inn[1], inn[1]), cz = clamp(z, -inn[2], inn[2]);
    const ox = x - cx, oy = y - cy, oz = z - cz, L = Math.hypot(ox, oy, oz); let nx = N[i], ny = N[i + 1], nz = N[i + 2];
    if (L > 1e-6) { nx = ox / L; ny = oy / L; nz = oz / L; const k = r + amp * noise(x, y, z, v); P[i] = cx + nx * k; P[i + 1] = cy + ny * k; P[i + 2] = cz + nz * k; }
    else { const b = amp * noise(x, y, z, v); P[i] += nx * b; P[i + 1] += ny * b; P[i + 2] += nz * b; }
    N[i] = nx; N[i + 1] = ny; N[i + 2] = nz;

}
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m; }
const box = (w, h, d, c, x, y, z, p) => mesh(rbox(w, h, d, (w * 7 + h * 3) % 3 | 0), M(c), x, y, z, p);

// ---------- lumière et ciel ----------
const hemi = new THREE.HemisphereLight(0xf4f7ff, 0x9aa4b8, 1.3); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0dd, 1.6); sun.castShadow = true;
sun.shadow.mapSize.set(LOW ? 1024 : 2048, LOW ? 1024 : 2048); Object.assign(sun.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 1, far: 160 }); sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);
const skyU = { top: { value: new THREE.Color() }, bot: { value: new THREE.Color() }, sd: { value: V(0, 1, 0) }, sc: { value: new THREE.Color() }, sa: { value: 1 } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 24, 14), new THREE.ShaderMaterial({ uniforms: skyU, side: THREE.BackSide, depthWrite: false,
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bot; uniform vec3 sd; uniform vec3 sc; uniform float sa; varying vec3 vD; void main(){ float h = clamp(vD.y*1.4,0.0,1.0); vec3 c = mix(bot, top, pow(h,0.75)); float s = max(dot(vD, normalize(sd)),0.0); c += sc*(pow(s,500.0)*1.3 + pow(s,10.0)*0.35)*sa; gl_FragColor = vec4(c,1.0);\n#include <colorspace_fragment>\n}' }));
sky.frustumCulled = false; scene.add(sky);
const PAL = [ // [fraction, ciel haut, horizon, hemi ciel, hemi sol, hemi int, soleil, int, élévation, nuit]
  [0, 0x8db5de, 0xe6edf4, 0xf4f7ff, 0x9aa4b8, 1.3, 0xfff0dd, 1.6, 0.8, 0],
  [0.45, 0x8db5de, 0xe6edf4, 0xf4f7ff, 0x9aa4b8, 1.3, 0xfff0dd, 1.6, 0.6, 0],
  [0.6, 0x7f9ed2, 0xffd9ab, 0xffe6cc, 0xa49ab0, 1.15, 0xffc48a, 1.5, 0.3, 0],
  [0.7, 0x46589a, 0xff9a62, 0xffc4a4, 0x8f86a8, 1.0, 0xff8a4a, 1.15, 0.1, 0.55],
  [0.78, 0x0d1636, 0x2c3c70, 0x8ea2e0, 0x2a3050, 0.75, 0xa9bcff, 0.5, 0.8, 1],
  [0.93, 0x0d1636, 0x2c3c70, 0x8ea2e0, 0x2a3050, 0.75, 0xa9bcff, 0.5, 0.8, 1],
  [0.97, 0x46589a, 0xffb07a, 0xffc4a4, 0x8f86a8, 1.0, 0xffa060, 1.2, 0.12, 0.5],
  [1, 0x8db5de, 0xe6edf4, 0xf4f7ff, 0x9aa4b8, 1.3, 0xfff0dd, 1.6, 0.8, 0],
];
const cA = new THREE.Color(), cB = new THREE.Color();
const mixC = (out, a, b, k) => out.copy(cA.setHex(a)).lerp(cB.setHex(b), k);
let NIGHT = 0; const DAYLEN = 200;
const winMats = [];
function skyAt(t) {
  const f = (t / DAYLEN + 0.3) % 1; let i = 0; while (i < PAL.length - 2 && f > PAL[i + 1][0]) i++;
  const a = PAL[i], b = PAL[i + 1], k = ease((f - a[0]) / (b[0] - a[0]));
  mixC(skyU.top.value, a[1], b[1], k); mixC(skyU.bot.value, a[2], b[2], k); scene.fog.color.copy(skyU.bot.value);
  mixC(hemi.color, a[3], b[3], k); mixC(hemi.groundColor, a[4], b[4], k); hemi.intensity = lerp(a[5], b[5], k);
  mixC(sun.color, a[6], b[6], k); sun.intensity = lerp(a[7], b[7], k);
  const el = lerp(a[8], b[8], k), az = 0.4 + f * 1.6, d = V(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el));
  sun.position.set(d.x * 70, Math.max(8, d.y * 70), d.z * 70); skyU.sd.value.copy(d); skyU.sc.value.copy(sun.color);
  NIGHT = lerp(a[9], b[9], k); skyU.sa.value = 1 - NIGHT * 0.6;
  for (const m of winMats) m.emissive.setHex(0xffb24a).multiplyScalar(NIGHT * 1.1);
}

// ---------- sol de neige (congères dans l'éclairage) ----------
{
  const S = LOW ? 80 : 140, g = new THREE.PlaneGeometry(260, 260, S, S), P = g.attributes.position.array, N = g.attributes.normal.array, C = new Float32Array(P.length);
  const h = (x, y) => Math.sin(x * 0.21) * Math.cos(y * 0.17) * 0.6 + Math.sin(x * 0.07 + y * 0.11) * 1.2 + Math.sin(x * 0.53 - y * 0.47) * 0.25;
  for (let i = 0; i < P.length; i += 3) { const x = P[i], y = P[i + 1], dx = (h(x + 0.5, y) - h(x - 0.5, y)), dy = (h(x, y + 0.5) - h(x, y - 0.5)); const L = Math.hypot(dx * 0.5, dy * 0.5, 1); N[i] = -dx * 0.5 / L; N[i + 1] = -dy * 0.5 / L; N[i + 2] = 1 / L; const k = clamp(0.5 + h(x, y) * 0.18); C[i] = lerp(0.86, 1, k); C[i + 1] = lerp(0.9, 1, k); C[i + 2] = 1; }
  g.setAttribute('color', new THREE.BufferAttribute(C, 3));
  const gr = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0xf6f8fc, vertexColors: true })); gr.rotation.x = -Math.PI / 2; gr.receiveShadow = true; scene.add(gr);
}

// ---------- village autour de la place ----------
const chimneys = [];
const glass = new THREE.MeshLambertMaterial({ color: 0x6f86a8 }); winMats.push(glass);
function house(x, z, ry, wall, roof) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  const w = R(4.5, 6), h = R(3, 4), d = R(4, 5);
  box(w, h, d, wall, 0, h / 2, 0, g);
  const r = mesh(new THREE.CylinderGeometry(0.01, Math.max(w, d) * 0.74, h * 0.7, 4), M(roof), 0, h + h * 0.35, 0, g); r.rotation.y = Math.PI / 4; r.scale.set(w / Math.max(w, d), 1, d / Math.max(w, d));
  const cap = mesh(new THREE.CylinderGeometry(0.01, Math.max(w, d) * 0.74 * 0.62, h * 0.7 * 0.6, 4), M(0xfbfcff), 0, h + h * 0.35 + h * 0.7 * 0.2 + 0.03, 0, g, false); cap.rotation.y = Math.PI / 4; cap.scale.copy(r.scale);
  for (const sx of [-0.25, 0.25]) { box(1.0, 1.0, 0.12, 0xf4f1ea, sx * w, h * 0.55, d / 2 + 0.02, g); mesh(rbox(0.75, 0.75, 0.12, 1), glass, sx * w, h * 0.55, d / 2 + 0.07, g); }
  box(0.95, 1.8, 0.12, 0x5a3b22, 0, 0.9, d / 2 + 0.03, g);
  const ch = new THREE.Group(); ch.position.set(w * 0.22, h + 0.4, -d * 0.15); g.add(ch);
  box(0.6, h * 0.7 + 0.8, 0.6, 0x9c4a3a, 0, (h * 0.7 + 0.8) / 2, 0, ch); box(0.75, 0.16, 0.75, 0xfbfcff, 0, h * 0.7 + 0.88, 0, ch);
  ch.userData.top = h * 0.7 + 1.0; chimneys.push(ch);
}
const wallC = [0xe6a72a, 0x6fa8dc, 0xe86aa8, 0x2e8b4a, 0xc7302e, 0x9b6bd6, 0xf2efe6, 0xf2c230];
for (let i = 0; i < 7; i++) house(-27 + i * 9, -26 + R(-1.5, 1.5), 0, wallC[i % 8], [0x3b3f4a, 0x7a1f1f, 0x2b4a7a][i % 3]);
for (let i = 0; i < 5; i++) house(-22 + i * 11, 27 + R(-1.5, 1.5), Math.PI, wallC[(i + 3) % 8], [0x7a1f1f, 0x3b3f4a][i % 2]);
// fumée des cheminées (une seule InstancedMesh)
const SMK = 6, smoke = new THREE.InstancedMesh(lumpGeo(0.45, 0.14, 2, 1), M(0xeef0f4), chimneys.length * SMK); smoke.frustumCulled = false; scene.add(smoke);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _v = new THREE.Vector3(), _s = new THREE.Vector3(), _e = new THREE.Euler();
scene.updateMatrixWorld(true);
const chimTop = chimneys.map((c) => V(0, c.userData.top, 0).applyMatrix4(c.matrixWorld));
function smokeAt(t) { let k = 0; chimTop.forEach((w, ci) => { for (let i = 0; i < SMK; i++) { const ph = (t * 0.2 + i / SMK + ci * 0.17) % 1; const sc = Math.sin(Math.min(1, ph * 1.15) * Math.PI) * (0.55 + ph * 1.4); smoke.setMatrixAt(k++, _m.compose(_v.set(w.x + Math.sin(ph * 5 + ci) * 0.3 + ph * 2, w.y + ph * 4.5, w.z + ph * 0.8), _q.setFromEuler(_e.set(ph * 2, ph * 3 + ci, 0)), _s.setScalar(sc))); } }); smoke.instanceMatrix.needsUpdate = true; }

// sapins (qui laissent tomber leur neige)
const trees = [];
function tree(x, z, s) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); scene.add(g);
  mesh(new THREE.CylinderGeometry(0.25, 0.32, 1.2, 10), M(0x6b4a2f), 0, 0.6, 0, g);
  for (const [r, h, y] of [[2.2, 2.4, 1.9], [1.75, 2.1, 3.3], [1.25, 1.9, 4.6]]) { mesh(new THREE.ConeGeometry(r, h, 12), M(0x2f7a3e), 0, y, 0, g); mesh(new THREE.ConeGeometry(r * 0.48, h * 0.44, 12), M(0xf7f9fc), 0, y + h * 0.3, 0, g, false); }
  trees.push(g); return g;
}
for (let i = 0; i < 46; i++) { const a = rnd() * Math.PI * 2, d = 36 + rnd() * 30; tree(Math.cos(a) * d * 1.2, Math.sin(a) * d * 0.9, 0.9 + rnd() * 0.8); }
[[-30, -12], [-31, 8], [31, -10], [30, 9], [-8, -18], [9, -19], [-12, 18], [13, 19]].forEach(([x, z]) => tree(x, z, 1 + rnd() * 0.4));
const DROPS = LOW ? 5 : 8, DB = 7, drops = new THREE.InstancedMesh(lumpGeo(0.2, 0.15, 4, 1), M(0xffffff), DROPS * DB); drops.frustumCulled = false; scene.add(drops);
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function treeDrops(t) {
  trees.forEach((g) => { g.rotation.z = 0; }); let k = 0; const P = 3.2;
  for (let j = 0; j < DROPS; j++) {
    const tt = t + j * P / DROPS, c = Math.floor(tt / P), ph = tt / P - c, g = trees[Math.floor(hash(c * 7.1 + j * 3.3) * trees.length)], b0 = g.position, s = g.scale.y;
    if (ph < 0.25) g.rotation.z = Math.sin(ph * 60) * 0.05 * (1 - ph * 4);
    for (let b = 0; b < DB; b++) {
      if (ph > 0.62) { drops.setMatrixAt(k++, _m.compose(_v.set(0, -9, 0), _q.identity(), _s.setScalar(0.001))); continue; }
      const a = hash(c * 3.1 + b * 1.7 + j) * 6.28, rr = (0.8 + hash(b + c) * 1.2) * s, h0 = (3.2 + hash(b * 9 + j) * 1.8) * s, f = clamp((ph - 0.05 - b * 0.012) / 0.4);
      const y = Math.max(0.12, h0 - 11.8 * Math.pow(f * 1.3, 2)), land = y <= 0.13, sc = land ? 0.9 * (1 - clamp((ph - 0.45) / 0.17)) * 1.4 : 0.8 + hash(b * 5) * 0.6;
      drops.setMatrixAt(k++, _m.compose(_v.set(b0.x + Math.cos(a) * rr * (1 + f * 0.5), y, b0.z + Math.sin(a) * rr * (1 + f * 0.5)), _q.identity(), _s.set(sc * (land ? 1.6 : 1), sc * (land ? 0.45 : 1), sc * (land ? 1.6 : 1))));

}
// bonhomme de neige qui regarde l'action
const snowman = new THREE.Group(); snowman.position.set(-2, 0, -15); scene.add(snowman);
{
  const sm = M(0xfbfcff); mesh(lumpGeo(1.05, 0.05, 1), sm, 0, 0.9, 0, snowman); mesh(lumpGeo(0.78, 0.05, 2), sm, 0, 2.35, 0, snowman);
  const hd = new THREE.Group(); hd.position.y = 3.45; snowman.add(hd); snowman.userData.head = hd; mesh(lumpGeo(0.55, 0.05, 3), sm, 0, 0, 0, hd);
  for (const x of [-0.19, 0.19]) mesh(lumpGeo(0.075, 0.1, 1, 1), M(0x222226), x, 0.12, 0.49, hd, false);
  const n = mesh(new THREE.ConeGeometry(0.09, 0.6, 10), M(0xf07c2a), 0, 0, 0.78, hd); n.rotation.x = Math.PI / 2;
  mesh(new THREE.CylinderGeometry(0.33, 0.5, 0.55, 14), M(0x2e8b4a), 0, 0.55, 0, hd); mesh(lumpGeo(0.17, 0.1, 6, 1), M(0xffffff), 0, 0.92, 0, hd);
  const sc = mesh(new THREE.TorusGeometry(0.62, 0.13, 8, 20), M(0xd8262b), 0, 2.95, 0, snowman); sc.rotation.x = Math.PI / 2;
  for (const sx of [-1, 1]) { const a = mesh(new THREE.CylinderGeometry(0.04, 0.06, 1.5, 6), M(0x6b4a2f), sx * 1.25, 2.6, 0, snowman); a.rotation.z = sx * -1.0; }
}

// ---------- traces dans la neige (pas et traîneaux), anneau qui se recycle ----------
const PRINTS = LOW ? 500 : 1100;
const prG = new THREE.CircleGeometry(0.13, 10); prG.rotateX(-Math.PI / 2); prG.scale(1, 1, 1.9);
const prM = new THREE.MeshLambertMaterial({ color: 0xc4d0e4, transparent: true, opacity: 0.75, depthWrite: false });
const prints = new THREE.InstancedMesh(prG, prM, PRINTS); prints.frustumCulled = false; scene.add(prints);
for (let i = 0; i < PRINTS; i++) prints.setMatrixAt(i, _m.compose(_v.set(0, -5, 0), _q.identity(), _s.setScalar(0.001)));
let printI = 0;
function stamp(x, z, ang, sx = 1, sz = 1) { prints.setMatrixAt(printI, _m.compose(_v.set(x, 0.03, z), _q.setFromEuler(_e.set(0, ang, 0)), _s.set(sx, 1, sz))); printI = (printI + 1) % PRINTS; prints.instanceMatrix.needsUpdate = true; }

// ---------- flocons ----------

// --- le chien qui vole une tuque ---
